name: Feature request
description: Propose a new capability or a change to a tool or API.
labels: [enhancement, triage]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - codex
        - questlog
        - affinity
        - souls
        - grimoire
        - email
        - telegram
        - not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you or your agent trying to do, and where does the library get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API, tool or behaviour you have in mind. Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This works without adding a runtime dependency
